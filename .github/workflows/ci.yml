name: CI

# 對 PR 與 main 執行本機品質檢查與 DP-030 Playwright e2e。
# Supabase db reset／pgTAP 仍待 DP-033，且不連線到正式資料。
on:
  pull_request:
  push:
    branches: [main]
  # DP-033：部署前由 deploy-staging.yml 呼叫同一組檢查，不另外複製一份步驟。
  workflow_call:

# 這個 workflow 只做唯讀驗證，不寫回 repository。
permissions:
  contents: read

# 同一分支有新 push 時取消尚未完成的舊 run。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 不設定任何 env secret。日後若某個步驟需要密鑰，只能經由 GitHub Secrets
    # 注入到該步驟，不得寫進這個檔案或 repository 其他位置。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本以 .nvmrc 為單一事實來源，與 package.json 的 engines 一致。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check Supabase migrations parse structurally
        run: npm run check:migrations

      - name: Unit tests
        run: npm run test

      # prebuild 會產生 public/version.json 與版本化的 public/sw.js。
      - name: Build
        run: npm run build

      # DP-015：production build 不得有執行期遠端依賴，且必須帶 CSP。
      - name: Check build assets
        run: npm run check:build

      # DP-068：手寫 link 與建置 base 不一致這類問題只在絕對 base 下出現，
      # 預設的相對建置抓不到。子路徑是 GitHub Pages 的形狀，根路徑則是另一
      # 種同樣合法、而且第一版正則漏掉的形狀。
      - name: Build and check with a subpath base
        run: |
          npm run build -- --base=/DayPop/
          npm run check:build

      - name: Build and check with a root base
        run: |
          npm run build -- --base=/
          npm run check:build

  e2e:
    name: Playwright / mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright 的套件版號由 package-lock 固定；只下載對應的 Chromium。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Auth／Storage 使用 repo 內 deterministic fake，不需要任何 secret。
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14
