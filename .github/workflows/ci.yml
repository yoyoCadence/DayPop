name: CI

# 對 PR 與 main 執行本機品質檢查、DP-030 Playwright e2e 與 DP-084 的
# Supabase db reset／pgTAP。全部只在 runner 內跑，不連線到任何 Supabase
# 專案，也不碰正式資料。
#
# DP-086：runner 固定為 ubuntu-26.04，不用 ubuntu-latest。ubuntu-latest 會在
# 沒有任何 PR 的情況下換作業系統（2026-10-19 起分批改成 26.04），而
# `playwright install --with-deps` 與 Supabase 的 Docker 流程都依賴 OS。
# 升級時把這裡三處與 deploy-staging.yml 兩處一起改，並讓 CI 完整跑一輪。
on:
  pull_request:
  push:
    branches: [main]
  # DP-033：部署前由 deploy-staging.yml 呼叫同一組檢查，不另外複製一份步驟。
  workflow_call:

# 這個 workflow 只做唯讀驗證，不寫回 repository。
permissions:
  contents: read

# 同一分支有新 push 時取消尚未完成的舊 run。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # 不設定任何 env secret。日後若某個步驟需要密鑰，只能經由 GitHub Secrets
    # 注入到該步驟，不得寫進這個檔案或 repository 其他位置。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本以 .nvmrc 為單一事實來源，與 package.json 的 engines 一致。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check Supabase migrations parse structurally
        run: npm run check:migrations

      - name: Unit tests
        run: npm run test

      # prebuild 會產生 public/version.json 與版本化的 public/sw.js。
      - name: Build
        run: npm run build

      # DP-015：production build 不得有執行期遠端依賴，且必須帶 CSP。
      - name: Check build assets
        run: npm run check:build

      # DP-068：手寫 link 與建置 base 不一致這類問題只在絕對 base 下出現，
      # 預設的相對建置抓不到。子路徑是 GitHub Pages 的形狀，根路徑則是另一
      # 種同樣合法、而且第一版正則漏掉的形狀。
      - name: Build and check with a subpath base
        run: |
          npm run build -- --base=/DayPop/
          npm run check:build

      - name: Build and check with a root base
        run: |
          npm run build -- --base=/
          npm run check:build

  e2e:
    name: Playwright / mobile and desktop
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright 的套件版號由 package-lock 固定；只下載對應的 Chromium。
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Auth／Storage 使用 repo 內 deterministic fake，不需要任何 secret。
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: output/playwright/
          retention-days: 14

  # DP-084：migration 必須能從零重建，且 pgTAP（owner RLS、跨帳號隔離、
  # RPC 與附件清理）全部通過；DP-085 再要求 src/lib/database.types.ts 與
  # 重建後的 schema 一致。只用 runner 內的本機 Postgres：不 link 遠端
  # 專案、不需要任何 secret。CLI 版本由 package-lock 固定，指令與本機的
  # npm scripts 相同。
  database:
    name: Supabase / db reset and pgTAP
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # DP-088：所有 Supabase 映像直接從 ghcr.io 拉，不經 public.ecr.aws（CLI
    # 預設）。ECR 對匿名拉取有兩種限制，CI 都遇過：`toomanyrequests: Rate
    # exceeded`，以及 2026-09-29 讓 staging 部署閘門失敗的 `Data limit
    # exceeded`。start／reset／test 遇到 ECR 拒絕時 CLI 會自行改拉 ghcr.io，
    # 但 gen types 啟動 postgres-meta 走的是直接 `docker run`，沒有這個備援，
    # 所以當時只有型別比對那一步失敗。設成 ghcr.io 之後每一條路徑都不碰
    # ECR（本機以同一版 CLI 實測：七個映像全部來自 ghcr.io，ECR 參照 0 次）。
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 也會安裝 package-lock 固定版本的 Supabase CLI。
      - name: Install dependencies
        run: npm ci

      # 只啟動 Postgres 容器，其餘服務與這些測試無關。
      # 2026-09-29 以同一版 CLI 在本機比對：這個組合與完整 stack 在 db reset
      # 之後，auth／storage 的欄位、trigger、function、policy、index、RLS
      # 開關，以及 extension 與 schema 清單都逐行相同，pgTAP 兩邊都是 150/150。
      # 若日後的測試需要 gotrue 或 storage-api 的 HTTP API，才從這份清單移除。
      #
      # 「只啟動」不等於「只下載」：CI log 顯示 CLI 初始化 schema 時仍會拉
      # gotrue、realtime、storage-api 的映像來跑它們各自的 migration（這也是
      # 不啟動這些服務、auth／storage schema 仍然完整的原因），reset 會再拉
      # edge-runtime，test 會拉 pg_prove。排除清單省下的是其他服務。
      #
      # 映像來源見 job 層的 SUPABASE_INTERNAL_IMAGE_REGISTRY（DP-088）。若這個
      # job 仍紅在拉映像，先確認是 registry 的問題再重跑，不要當成 migration
      # 壞了。
      #
      # 輸出只列出資料庫連線網址，不會在 log 印出本機 stack 的 API key。
      - name: Start local Postgres
        run: >-
          npm run supabase:start --
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # start 已經套用過一次 migration。這裡仍照 AGENTS.md 的驗收條件
      # 「可由 db reset 重建」實際跑一次，而不是用「start 成功所以 reset 也會
      # 成功」的推論代替。
      - name: Rebuild database from migrations
        run: npm run supabase:reset

      - name: Database tests (pgTAP)
        run: npm run supabase:test

      # DP-085：型別檔必須就是從 migration 重建的資料庫產生出來的結果。
      # 以本機產生為準：--linked 需要 access token，而 CI 不使用 secret。
      # 本機產生不含 linked 才有的 __InternalSupabase 段落，所以 linked 或
      # MCP 產生的檔案不能直接提交。產生器表達不出的事實（例如 RPC 參數
      # 可以是 NULL）寫在呼叫端，見 supabaseRepository.ts 的 OccurrenceRpcArgs，
      # 不要手改這個檔案。
      - name: Check generated database types
        run: |
          npm run supabase:types
          if ! git diff --exit-code -- src/lib/database.types.ts; then
            echo "::error file=src/lib/database.types.ts::與 migration 產生的型別不一致。請在本機執行 npm run supabase:types 並提交結果，不要手改這個檔案。"
            exit 1
          fi
