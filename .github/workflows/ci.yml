name: CI

# 對 PR 與 main 執行與本機相同的四項驗證：lint、typecheck、unit、build。
# Supabase db reset／pgTAP（DP-033）與 Playwright e2e（DP-030）等對應任務完成後再加入。
on:
  pull_request:
  push:
    branches: [main]

# 這個 workflow 只做唯讀驗證，不寫回 repository。
permissions:
  contents: read

# 同一分支有新 push 時取消尚未完成的舊 run。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 不設定任何 env secret。日後若某個步驟需要密鑰，只能經由 GitHub Secrets
    # 注入到該步驟，不得寫進這個檔案或 repository 其他位置。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本以 .nvmrc 為單一事實來源，與 package.json 的 engines 一致。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # prebuild 會產生 public/version.json 與版本化的 public/sw.js。
      - name: Build
        run: npm run build
